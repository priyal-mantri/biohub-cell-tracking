[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "biohub-cell-tracking"
version = "1.0.0"
description = "3D Spatiotemporal Cell Tracking Architecture (Local Proposals + Global Graph Optimization)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "BioHub Cell Tracking Project Team"}
]
keywords = ["cell-tracking", "graph-neural-networks", "integer-linear-programming", "spatiotemporal-tracking", "3d-microscopy", "zarr"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "torch>=2.0.0",
    "zarr>=3.0.0",
    "networkx>=3.0",
    "pyyaml>=6.0",
    "msgspec>=0.18.0",
    "donfig>=0.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["."]
